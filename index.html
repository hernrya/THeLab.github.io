<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THeLab</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
    }
    main {
      text-align: center;
      padding: 2rem;
      max-width: 42rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin: 0 0 0.75rem;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0.5rem 0;
      font-size: 1.1rem;
      line-height: 1.5;
    }
    .under-construction {
      margin-top: 1.25rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main>
    <h1>Torgerson Lab + Hernandez Lab = THeLab!</h1>
    <p>We are building this site now.</p>
    <p class="under-construction">Under Construction</p>
  </main>
</body>
</html>
